{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://kit.fontawesome.com/2c4ce15497.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/estilosadmin.css' %}">
    <title>{% block titulo %}Bienvenido administrador{% endblock %}</title>
</head>
<body>

    <!-- ═══════════ HEADER ═══════════ -->
    <header class="vendedor">
        <div class="display">
            <div class="presentacion">
                <div class="img">
                    <img src="{% static 'imagenes/logo.png' %}">
                </div>
                <div class="text">
                    <h1>Creart</h1>
                    <p>{{ usuario.nombre }}</p>
                </div>
            </div>
            <ul>
                <li><a href="{% url 'cerrar_sesion' %}">Cerrar sesión</a></li>
            </ul>
        </div>
        <ul class="opciones">
            <li class="{% if pagina_activa == 'administrador' %}activo{% endif %}">
                <a href="{% url 'administrador' %}">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
            </li>
            <li class="{% if pagina_activa == 'transacciones' %}activo{% endif %}">
                <a href="{% url 'transacciones' %}">
                    <i class="fa-solid fa-envelope"></i> Transacciones
                </a>
            </li>
            <li class="{% if pagina_activa == 'usuarios' %}activo{% endif %}">
                <a href="{% url 'usuarios' %}">
                    <i class="fa-solid fa-bag-shopping"></i> Usuarios
                </a>
            </li>
            <li class="{% if pagina_activa == 'pqrs' %}activo{% endif %}">
                <a href="{% url 'pqrs' %}">
                    <i class="fa-solid fa-people-line"></i> PQRS
                </a>
            </li>
            <li class="{% if pagina_activa == 'perfil' %}activo{% endif %}">
                <a href="{% url 'administrador_perfil' %}">
                    <i class="fa-solid fa-user"></i> Perfil
                </a>
            </li>
        </ul>
    </header>

    <!-- ═══════════ CONTENIDO DE CADA PÁGINA ═══════════ -->
    <main class="contenido-principal">
        {% block contenido %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
