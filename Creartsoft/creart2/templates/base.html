<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasteles y Postres</title>

    <style>

        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background-color:#F3F4F4;
        }

        header{
            background:#2C2C2C;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#853953;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        nav a:hover{
            color:#F3F4F4;
        }

        .container{
            padding:40px;
        }

        footer{
            background:#612D53;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:40px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 3px 10px rgba(0,0,0,0.1);
            width:250px;
            text-align:center;
        }

        .productos{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

    </style>

</head>

<body>

<header>
    <h1>Pasteles & Postres Personalizados</h1>
</header>

<nav>
    <a href="/">Inicio</a>
    <a href="/productos">Productos</a>
</nav>

<div class="container">

{% block content %}
{% endblock %}

</div>

<footer>
    <p>Pastelería Creativa | Postres personalizados</p>
</footer>

</body>
</html>
